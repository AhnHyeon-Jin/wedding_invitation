<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리의 결혼식</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Noto Serif KR", serif;
        background: #fafafa;
        color: #333;
        text-align: center;
      }

      .section {
        padding: 40px 20px;
      }

      .hero {
        background: url("https://via.placeholder.com/800x1000") center/cover
          no-repeat;
        color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background-blend-mode: darken;
        background-color: rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .date {
        font-size: 18px;
      }

      .divider {
        width: 50px;
        height: 2px;
        background: #ccc;
        margin: 20px auto;
      }

      .gallery img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 10px;
      }

      .map {
        width: 100%;
        height: 300px;
        border: none;
      }

      .footer {
        font-size: 14px;
        color: #777;
      }

      .btn {
        display: inline-block;
        padding: 12px 20px;
        margin-top: 10px;
        background: #333;
        color: white;
        border-radius: 8px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- 메인 -->
    <div class="hero">
      <h1>안현진 ♥ 김지수</h1>
      <div class="date">2026.10.11 토요일 오전 10시 40분</div>
    </div>

    <!-- 인사말 -->
    <div class="section">
      <p>
        서로가 마주보며 다져온 사랑을 이제 함께 한 길로 걸어가고자 합니다. 귀한
        걸음으로 축복해 주시면 더없는 기쁨으로 간직하겠습니다.
      </p>
    </div>

    <div class="divider"></div>

    <!-- 정보 -->
    <div class="section">
      <h2>예식 안내</h2>
      <p>2026년 10월 11일 토요일 오전 10시 40분</p>
      <p>더링크서울 트리뷰트 포트폴리오 호텔 웨딩</p>
    </div>

    <div class="divider"></div>

    <!-- 지도 -->
    <div class="section">
      <h2>오시는 길</h2>
      <iframe
        class="map"
        src="https://map.naver.com/p/entry/place/1070501110?c=17.08,0,0,0,dh&placePath=/home?from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604091729&locale=ko&svcName=map_pcv5"
      >
      </iframe>
      <br />
      <a class="btn" href="https://maps.google.com?q=seoul" target="_blank"
        >지도 열기</a
      >
    </div>

    <div class="divider"></div>

    <!-- 갤러리 -->
    <div class="section gallery">
      <h2>Gallery</h2>
      <img src="https://via.placeholder.com/400x300" />
      <img src="https://via.placeholder.com/400x300" />
      <img src="https://via.placeholder.com/400x300" />
    </div>

    <div class="divider"></div>

    <!-- 연락처 -->
    <div class="section">
      <h2>연락처</h2>
      <p>신랑: 010-7160-4636</p>
      <p>신부: 010-7557-7871</p>
    </div>

    <!-- 푸터 -->
    <div class="section footer">
      <p>소중한 날 함께해 주셔서 감사합니다</p>
    </div>
  </body>
</html>
